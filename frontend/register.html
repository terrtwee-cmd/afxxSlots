<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Registrarse — AFXX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700;800&family=Alumni+Sans:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/brand/logo-coin.png" />
</head>
<body>
  <div class="phone-shell auth-shell">
    <header class="m-header">
      <button class="auth-back" onclick="window.location.href='index.html'" aria-label="Volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <img src="assets/logo.png" alt="AFXX" class="m-logo" />
      <span style="width:34px"></span>
    </header>

    <main class="m-views auth-views">
      <div class="auth-promo">
        <h2>HASTA UN</h2>
        <div class="big">50% DE</div>
        <h2>REEMBOLSO INICIAL</h2>
        <img class="auth-promo-art auth-promo-mascot" src="assets/mascot/mascot-full.png" alt="Mascota AFXX" />
      </div>

      <div class="auth-form">
        <h3>Registrarse</h3>
        <div class="input-group">
          <input type="text" class="input" id="reg-contact" placeholder="Correo electrónico / Número de teléfono" />
        </div>
        <div class="input-group">
          <input type="password" class="input" id="reg-pwd" placeholder="Contraseña" />
          <button class="input-toggle" onclick="togglePwd('reg-pwd', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="dropdown" onclick="alert('Código de invitación (opcional)')">
          <span>Código de invitación (opcional)</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" checked />
          <span>Acepto la <a href="#">Política de privacidad</a> y los <a href="#">Términos</a> y confirmo que soy mayor de 18 años.</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" checked />
          <span>Acepto recibir notificaciones y mensajes promocionales vía SMS y correo electrónico.</span>
        </label>
        <button class="btn btn-primary btn-lg btn-block" style="position: relative;" onclick="doRegister()">
          Registrarse
          <span class="register-badge">+50% en el Primer Depósito 🎁</span>
        </button>
        <p id="register-error" style="color:#e11d2e; font-size:12px; text-align:center; margin-top:6px;"></p>
        <p style="text-align: center; font-size: 13px; margin-top: 4px;">
          ¿Ya tienes una cuenta? <a href="login.html" class="link-text">Iniciar sesión</a>
        </p>
        <div class="divider-or">o</div>
        <button class="btn-google">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = '/api';

    async function doRegister() {
      const contact = document.getElementById('reg-contact').value.trim();
      const password = document.getElementById('reg-pwd').value;
      const errorEl = document.getElementById('register-error');
      errorEl.textContent = '';
      if (!contact || !password) {
        errorEl.textContent = 'Escribe tu correo/teléfono y contraseña.';
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        return;
      }
      try {
        const res = await fetch(API_BASE + '/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contact, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'No se pudo registrar.';
          return;
        }
        localStorage.setItem('afxx_token', data.token);
        window.location.href = 'index.html';
      } catch (e) {
        errorEl.textContent = 'No se pudo conectar al backend. ¿El backend está corriendo?';
      }
    }

    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/></svg>';
      } else {
        inp.type = 'password';
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      }
    }
  </script>
</body>
</html>
